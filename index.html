<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recursos Didácticos — Guía Final</title>
<style>
:root{
  --bg:#f4f1ea; --panel:#ffffff; --ink:#22262b; --muted:#6b7280;
  --accent1:#2563eb; --accent2:#7c3aed; --good:#16a34a; --bad:#dc2626;
  --border:#e2ddd0; --header:#1f2937;
}
body.dark{
  --bg:#14171c; --panel:#1c2028; --ink:#e8e6df; --muted:#9aa1ac;
  --accent1:#60a5fa; --accent2:#a78bfa; --good:#4ade80; --bad:#f87171;
  --border:#2b303a; --header:#0d0f13;
}
*{box-sizing:border-box;}
body{
  margin:0; font-family:'Segoe UI', system-ui, -apple-system, sans-serif;
  background:var(--bg); color:var(--ink); transition:background .25s, color .25s;
  padding-bottom:40px;
}
header{
  position:sticky; top:0; z-index:50; background:var(--header);
  color:#fff; padding:10px 14px; box-shadow:0 2px 8px rgba(0,0,0,.2);
}
.header-top{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;}
.header-top h1{font-size:1rem; margin:0; letter-spacing:.3px;}
.header-top small{display:block; color:#b9c0cc; font-weight:400; font-size:.72rem;}
#darkToggle, #restartBtn{
  background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.25); color:#fff;
  border-radius:20px; padding:6px 12px; font-size:.75rem; cursor:pointer;
}
#darkToggle:hover, #restartBtn:hover{background:rgba(255,255,255,.22);}
.block-nav{display:flex; gap:5px; overflow-x:auto; margin-top:8px; padding-bottom:4px;}
.block-nav button{
  flex:0 0 auto; background:rgba(255,255,255,.08); color:#dfe3e8; border:1px solid rgba(255,255,255,.15);
  border-radius:14px; padding:4px 9px; font-size:.68rem; cursor:pointer; white-space:nowrap;
}
.block-nav button.active{background:linear-gradient(90deg,var(--accent1),var(--accent2)); color:#fff; border-color:transparent;}
.progress-wrap{height:8px; background:rgba(255,255,255,.12); border-radius:4px; margin-top:8px; overflow:hidden;}
.progress-bar{height:100%; background:linear-gradient(90deg,var(--accent1),var(--accent2)); width:0%; transition:width .3s;}
main{max-width:680px; margin:20px auto; padding:0 14px;}
.card{
  background:var(--panel); border:1px solid var(--border); border-radius:14px;
  padding:18px; box-shadow:0 1px 4px rgba(0,0,0,.06);
}
.block-tag{font-size:.7rem; text-transform:uppercase; letter-spacing:.5px; color:var(--accent1); font-weight:700;}
.qcount{float:right; font-size:.7rem; color:var(--muted);}
.source-tag{display:inline-block; font-size:.62rem; padding:2px 7px; border-radius:8px; margin-left:6px; vertical-align:middle;}
.source-tag.notes{background:color-mix(in srgb, var(--good) 18%, var(--panel)); color:var(--good);}
.source-tag.general{background:color-mix(in srgb, var(--accent2) 18%, var(--panel)); color:var(--accent2);}
h2.qtext{font-size:1.05rem; margin:10px 0 16px 0; line-height:1.4;}
.option{
  display:flex; align-items:flex-start; gap:10px; width:100%; text-align:left;
  background:var(--bg); border:1.5px solid var(--border); border-radius:10px;
  padding:11px 12px; margin-bottom:9px; cursor:pointer; font-size:.9rem; color:var(--ink);
  transition:all .15s;
}
.option:hover:not(.locked){border-color:var(--accent1);}
.option .letter{
  flex:0 0 22px; height:22px; border-radius:50%; background:var(--border); color:var(--ink);
  display:flex; align-items:center; justify-content:center; font-size:.72rem; font-weight:700;
}
.option.correct{border-color:var(--good); background:color-mix(in srgb, var(--good) 14%, var(--panel));}
.option.correct .letter{background:var(--good); color:#fff;}
.option.incorrect{border-color:var(--bad); background:color-mix(in srgb, var(--bad) 14%, var(--panel));}
.option.incorrect .letter{background:var(--bad); color:#fff;}
.option.locked{cursor:default;}
.feedback{
  margin-top:12px; padding:12px 14px; border-radius:10px; font-size:.84rem; line-height:1.5;
  display:none; border-left:4px solid var(--accent1);
  background:color-mix(in srgb, var(--accent1) 8%, var(--panel));
}
.feedback.show{display:block;}
.feedback .es{margin-bottom:8px;}
.feedback .en{color:var(--muted); font-style:italic;}
.feedback .tag{font-weight:700; margin-bottom:4px;}
.tag.correct-tag{color:var(--good);}
.tag.incorrect-tag{color:var(--bad);}
.nav-btns{display:flex; justify-content:space-between; margin-top:18px; gap:10px;}
.nav-btns button{
  flex:1; padding:11px; border-radius:10px; border:none; font-size:.88rem; font-weight:600;
  cursor:pointer; background:var(--accent1); color:#fff;
}
.nav-btns button:disabled{opacity:.35; cursor:not-allowed;}
.nav-btns button.secondary{background:var(--border); color:var(--ink);}
.results{text-align:center;}
.results h2{margin-top:0;}
.score-circle{
  width:130px; height:130px; border-radius:50%; margin:16px auto;
  background:conic-gradient(var(--accent1) calc(var(--pct,0)*1%), var(--border) 0);
  display:flex; align-items:center; justify-content:center;
}
.score-circle span{
  background:var(--panel); width:100px; height:100px; border-radius:50%;
  display:flex; align-items:center; justify-content:center; font-size:1.3rem; font-weight:700;
}
.block-breakdown{text-align:left; margin-top:16px;}
.block-breakdown div.row{display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid var(--border); font-size:.85rem;}
.modal-overlay{
  position:fixed; inset:0; background:rgba(0,0,0,.5); display:none;
  align-items:center; justify-content:center; z-index:100; padding:20px;
}
.modal-overlay.show{display:flex;}
.modal{background:var(--panel); border-radius:14px; padding:20px; max-width:320px; text-align:center;}
.modal p{font-size:.9rem; color:var(--muted);}
.modal-btns{display:flex; gap:10px; margin-top:14px;}
.modal-btns button{flex:1; padding:10px; border-radius:8px; border:none; font-weight:600; cursor:pointer;}
.modal-btns .confirm{background:var(--bad); color:#fff;}
.modal-btns .cancel{background:var(--border); color:var(--ink);}
.legend{display:flex; gap:14px; justify-content:center; margin:14px 0 4px; font-size:.72rem; color:var(--muted); flex-wrap:wrap;}
.legend span{display:inline-flex; align-items:center; gap:5px;}
.legend .dot{width:9px; height:9px; border-radius:50%;}
.dot.notes{background:var(--good);}
.dot.general{background:var(--accent2);}
footer{text-align:center; color:var(--muted); font-size:.7rem; margin-top:24px;}
</style>
</head>
<body>
<header>
  <div class="header-top">
    <div>
      <h1>📋 Recursos Didácticos</h1>
      <small>Formulario de guía · Temas de examen</small>
    </div>
    <div style="display:flex; gap:8px;">
      <button id="restartBtn">↺ Reiniciar</button>
      <button id="darkToggle">🌙</button>
    </div>
  </div>
  <div class="block-nav" id="blockNav"></div>
  <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>
</header>

<main>
  <div class="legend">
    <span><span class="dot notes"></span> Basado en apuntes de clase</span>
    <span><span class="dot general"></span> Conocimiento general</span>
  </div>
  <div class="card" id="quizCard"></div>
</main>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h3>¿Reiniciar el formulario?</h3>
    <p>Se borrará todo tu progreso y respuestas guardadas. Esta acción no se puede deshacer.</p>
    <div class="modal-btns">
      <button class="cancel" id="modalCancel">Cancelar</button>
      <button class="confirm" id="modalConfirm">Sí, reiniciar</button>
    </div>
  </div>
</div>

<footer>Recursos Didácticos · 20 temas del formulario</footer>

<script>

// Flatten
const ALL = [];
BLOCKS.forEach((b, bi) => b.questions.forEach((q, qi) => ALL.push({...q, blockIdx:bi, blockTitle:b.title, qInBlock:qi})));

const STORAGE_KEY = "rd_form_progress_v1";
const THEME_KEY = "rd_form_theme_v1";

let state = loadState();

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      if(parsed && Array.isArray(parsed.answers) && parsed.answers.length === ALL.length){
        return parsed;
      }
    }
  }catch(e){}
  return {current:0, answers:new Array(ALL.length).fill(null), finished:false};
}
function saveState(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

// theme
if(localStorage.getItem(THEME_KEY) === "dark"){
  document.body.classList.add("dark");
  document.getElementById("darkToggle").textContent = "☀️";
}
document.getElementById("darkToggle").addEventListener("click", () => {
  document.body.classList.toggle("dark");
  const isDark = document.body.classList.contains("dark");
  localStorage.setItem(THEME_KEY, isDark ? "dark" : "light");
  document.getElementById("darkToggle").textContent = isDark ? "☀️" : "🌙";
});

// block nav
const blockNav = document.getElementById("blockNav");
BLOCKS.forEach((b, bi) => {
  const btn = document.createElement("button");
  btn.textContent = "T" + (bi+1);
  btn.title = b.title;
  btn.addEventListener("click", () => {
    const firstIdx = ALL.findIndex(q => q.blockIdx === bi);
    state.current = firstIdx;
    state.finished = false;
    saveState();
    render();
  });
  blockNav.appendChild(btn);
});

function updateProgress(){
  const answeredCount = state.answers.filter(a => a !== null).length;
  const pct = Math.round((answeredCount / ALL.length) * 100);
  document.getElementById("progressBar").style.width = pct + "%";
  const bnBtns = blockNav.querySelectorAll("button");
  const curBlock = state.finished ? -1 : ALL[state.current].blockIdx;
  bnBtns.forEach((b, i) => b.classList.toggle("active", i === curBlock));
}

function render(){
  updateProgress();
  if(state.finished){
    renderResults();
    return;
  }
  const card = document.getElementById("quizCard");
  const item = ALL[state.current];
  const savedAnswer = state.answers[state.current];

  card.innerHTML = `
    <div class="qcount">Pregunta ${state.current+1} / ${ALL.length}</div>
    <div class="block-tag">${item.blockTitle}<span class="source-tag ${item.src}">${item.src === "notes" ? "apuntes" : "general"}</span></div>
    <h2 class="qtext">${item.q}</h2>
    <div id="optionsWrap"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav-btns">
      <button class="secondary" id="prevBtn" ${state.current===0 ? "disabled":""}>← Anterior</button>
      <button id="nextBtn">${state.current === ALL.length-1 ? "Ver resultados" : "Siguiente →"}</button>
    </div>
  `;

  const letters = ["A","B","C","D"];
  const optionsWrap = document.getElementById("optionsWrap");
  item.options.forEach((opt, oi) => {
    const div = document.createElement("div");
    div.className = "option";
    div.innerHTML = `<span class="letter">${letters[oi]}</span><span>${opt}</span>`;
    if(savedAnswer !== null){
      div.classList.add("locked");
      if(oi === item.correct) div.classList.add("correct");
      else if(oi === savedAnswer) div.classList.add("incorrect");
    } else {
      div.addEventListener("click", () => selectAnswer(oi));
    }
    optionsWrap.appendChild(div);
  });

  if(savedAnswer !== null){
    showFeedback(item, savedAnswer);
  }

  document.getElementById("prevBtn").addEventListener("click", () => {
    if(state.current > 0){ state.current--; saveState(); render(); }
  });
  document.getElementById("nextBtn").addEventListener("click", () => {
    if(state.current === ALL.length-1){
      state.finished = true;
      saveState();
      render();
    } else {
      state.current++;
      saveState();
      render();
    }
  });
}

function selectAnswer(oi){
  state.answers[state.current] = oi;
  saveState();
  render();
}

function showFeedback(item, answerIdx){
  const fb = document.getElementById("feedback");
  const isCorrect = answerIdx === item.correct;
  fb.className = "feedback show";
  fb.innerHTML = `
    <div class="tag ${isCorrect ? 'correct-tag':'incorrect-tag'}">${isCorrect ? '✔ Correcto' : '✘ Incorrecto'}</div>
    <div class="es">${item.es}</div>
    <div class="en">${item.en}</div>
  `;
}

function renderResults(){
  const card = document.getElementById("quizCard");
  const score = state.answers.reduce((acc, a, i) => acc + (a === ALL[i].correct ? 1 : 0), 0);
  const pct = Math.round((score/ALL.length)*100);

  let breakdown = "";
  BLOCKS.forEach((b, bi) => {
    const idxs = ALL.map((q,i)=>i).filter(i => ALL[i].blockIdx === bi);
    const bScore = idxs.reduce((acc,i)=> acc + (state.answers[i]===ALL[i].correct?1:0),0);
    breakdown += `<div class="row"><span>${b.title}</span><span>${bScore}/${idxs.length}</span></div>`;
  });

  card.innerHTML = `
    <div class="results">
      <h2>🎓 Resultados</h2>
      <div class="score-circle" style="--pct:${pct}"><span>${pct}%</span></div>
      <p>${score} de ${ALL.length} respuestas correctas</p>
      <div class="block-breakdown">${breakdown}</div>
      <div class="nav-btns">
        <button class="secondary" id="reviewBtn">← Revisar respuestas</button>
        <button id="restartFromResults">↺ Reiniciar</button>
      </div>
    </div>
  `;
  document.getElementById("reviewBtn").addEventListener("click", () => {
    state.finished = false;
    state.current = 0;
    saveState();
    render();
  });
  document.getElementById("restartFromResults").addEventListener("click", openModal);
}

// restart modal
const modalOverlay = document.getElementById("modalOverlay");
document.getElementById("restartBtn").addEventListener("click", openModal);
document.getElementById("modalCancel").addEventListener("click", closeModal);
document.getElementById("modalConfirm").addEventListener("click", () => {
  localStorage.removeItem(STORAGE_KEY);
  state = {current:0, answers:new Array(ALL.length).fill(null), finished:false};
  saveState();
  closeModal();
  render();
});
function openModal(){ modalOverlay.classList.add("show"); }
function closeModal(){ modalOverlay.classList.remove("show"); }

render();
</script>
